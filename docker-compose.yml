services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cbt
      POSTGRES_PASSWORD: cbt
      POSTGRES_DB: cbt
    ports:
      - "5442:5432"
    volumes:
      - cbt_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbt"]
      interval: 5s
      timeout: 5s
      retries: 10

  central-api:
    build: ./central-api
    environment:
      CBT_DATABASE_URL: postgresql+psycopg://cbt:cbt@db:5432/cbt
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./central-api/data:/app/data

volumes:
  cbt_db_data:
